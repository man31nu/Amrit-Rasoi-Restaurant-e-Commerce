<div class="min-h-screen flex items-center justify-center relative overflow-hidden px-4 py-20 bg-[#0a0a12] text-white">
  <!-- Ambient background blobs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full opacity-20 blur-3xl pointer-events-none"
       style="background: radial-gradient(circle, #f97316, transparent)"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full opacity-15 blur-3xl pointer-events-none"
       style="background: radial-gradient(circle, #ef4444, transparent)"></div>

  <div class="w-full max-w-md animate-fadeUp relative z-10">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-10 text-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4 animate-pulse-glow shadow-xl text-white"
           style="background: var(--brand-gradient)">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold gradient-text">AmritRasoi</h1>
      <p class="text-sm mt-1 text-slate-400">
        Premium food, delivered with love
      </p>
    </div>

    <!-- Glass Card -->
    <div class="glass-card p-8">
      <h2 class="text-2xl font-bold mb-1 text-white">Welcome back</h2>
      <p class="text-sm mb-8 text-slate-400">
        Sign in to your account to continue
      </p>

      <form (ngSubmit)="handleSubmit()" class="space-y-5">
        <!-- Email -->
        <div>
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            class="form-input"
          />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="form-label">Password</label>
          <div class="relative">
            <input
              id="password"
              [type]="showPw() ? 'text' : 'password'"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              class="form-input pr-12"
            />
            <button
              type="button"
              (click)="togglePw()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors cursor-pointer"
              aria-label="Toggle password visibility"
            >
              @if (showPw()) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.046 10.046 0 013.122-.463c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-4.692-4.692a3 3 0 00-4.243-4.243M3 3l18 18"/>
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button
          id="login-submit"
          type="submit"
          [disabled]="loading()"
          class="btn-primary w-full mt-2 cursor-pointer"
        >
          @if (loading()) {
            <span class="spinner"></span>
          } @else {
            <span>Sign In</span>
          }
        </button>

        <!-- Google Sign In Official Button Container -->
        <div #googleBtnContainer class="w-full mt-3 flex justify-center min-h-[44px]"></div>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-slate-400">OR</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <p class="text-center text-sm text-slate-400">
        Don't have an account?
        <a
          routerLink="/signup"
          class="font-semibold text-orange-500 hover:text-orange-400 transition-colors hover:underline cursor-pointer ml-1"
        >
          Create one free
        </a>
      </p>
    </div>
  </div>
</div>
