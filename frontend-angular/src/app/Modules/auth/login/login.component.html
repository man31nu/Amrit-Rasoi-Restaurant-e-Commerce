<div class="min-h-screen flex items-center justify-center relative overflow-hidden px-4 py-20 bg-[#0a0a12] text-white">
  <!-- Ambient background blobs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full opacity-20 blur-3xl pointer-events-none"
       style="background: radial-gradient(circle, #f97316, transparent)"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full opacity-15 blur-3xl pointer-events-none"
       style="background: radial-gradient(circle, #ef4444, transparent)"></div>

  <div class="w-full max-w-md animate-fadeUp relative z-10">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-10 text-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4 animate-pulse-glow shadow-xl"
           style="background: var(--brand-gradient)">
        <span class="text-3xl">🍲</span>
      </div>
      <h1 class="text-3xl font-bold gradient-text">AmritRasoi</h1>
      <p class="text-sm mt-1 text-slate-400">
        Premium food, delivered with love
      </p>
    </div>

    <!-- Glass Card -->
    <div class="glass-card p-8">
      <h2 class="text-2xl font-bold mb-1 text-white">Welcome back</h2>
      <p class="text-sm mb-8 text-slate-400">
        Sign in to your account to continue
      </p>

      <form (ngSubmit)="handleSubmit()" class="space-y-5">
        <!-- Email -->
        <div>
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            class="form-input"
          />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="form-label">Password</label>
          <div class="relative">
            <input
              id="password"
              [type]="showPw() ? 'text' : 'password'"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              class="form-input pr-12"
            />
            <button
              type="button"
              (click)="togglePw()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors cursor-pointer"
              aria-label="Toggle password visibility"
            >
              {{ showPw() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button
          id="login-submit"
          type="submit"
          [disabled]="loading()"
          class="btn-primary w-full mt-2 cursor-pointer"
        >
          @if (loading()) {
            <span class="spinner"></span>
          } @else {
            <span>Sign In ➔</span>
          }
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-slate-400">OR</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <p class="text-center text-sm text-slate-400">
        Don't have an account?
        <a
          routerLink="/signup"
          class="font-semibold text-orange-500 hover:text-orange-400 transition-colors hover:underline cursor-pointer ml-1"
        >
          Create one free
        </a>
      </p>
    </div>
  </div>
</div>
