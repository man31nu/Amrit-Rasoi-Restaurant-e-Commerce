<div class="min-h-screen pt-32 pb-20 bg-gray-50/30">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Left Column: Avatar & Summary -->
      <div class="md:col-span-1 space-y-6">
        <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-gray-100 text-center">
          <div class="relative inline-block mb-6">
            <div class="w-32 h-32 bg-orange-100 text-orange-600 rounded-[2rem] flex items-center justify-center text-5xl font-black shadow-inner">
              {{ authService.user()?.name?.charAt(0)?.toUpperCase() || 'U' }}
            </div>
          </div>
          <h2 class="text-2xl font-black text-gray-900 mb-1">{{ authService.user()?.name }}</h2>
          <p class="text-gray-500 text-sm mb-6 uppercase tracking-widest font-bold">Member since 2026</p>
          
          <div class="flex flex-col gap-3">
            <div class="bg-orange-50/50 p-4 rounded-2xl border border-orange-100/50">
              <p class="text-xs font-bold text-orange-600 uppercase tracking-tighter mb-1">Role</p>
              <p class="text-xl font-black text-gray-900 uppercase">{{ authService.user()?.role }}</p>
            </div>
            <div class="bg-green-50/50 p-4 rounded-2xl border border-green-100/50">
              <p class="text-xs font-bold text-green-600 uppercase tracking-tighter mb-1">Account Status</p>
              <p class="text-xl font-black text-gray-900">Verified</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Information Form -->
      <div class="md:col-span-2">
        <div class="bg-white rounded-[2.5rem] p-8 sm:p-10 shadow-sm border border-gray-100">
          <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-gray-900 text-white rounded-xl flex items-center justify-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">Account <span class="text-orange-600">Settings</span></h1>
          </div>

          <form (ngSubmit)="handleSubmit()" class="space-y-8">
            <!-- Personal Info Section -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div class="space-y-2">
                <label class="text-sm font-black text-gray-400 uppercase tracking-widest ml-1">Full Name</label>
                <input
                  type="text"
                  [(ngModel)]="name"
                  name="name"
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 text-gray-900 font-bold focus:ring-2 focus:ring-orange-600/20 transition-all outline-none"
                  placeholder="John Doe"
                  required
                />
              </div>

              <div class="space-y-2">
                <label class="text-sm font-black text-gray-400 uppercase tracking-widest ml-1">Email Address</label>
                <input
                  type="email"
                  [value]="authService.user()?.email"
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 text-gray-900 font-bold opacity-70 cursor-not-allowed outline-none"
                  disabled
                />
              </div>

              <div class="space-y-2">
                <label class="text-sm font-black text-gray-400 uppercase tracking-widest ml-1">Phone Number</label>
                <input
                  type="text"
                  [(ngModel)]="phone"
                  name="phone"
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 text-gray-900 font-bold focus:ring-2 focus:ring-orange-600/20 transition-all outline-none"
                  placeholder="+91 9876 543 210"
                />
              </div>
              
              <div class="space-y-2 sm:col-span-2">
                <label class="text-sm font-black text-gray-400 uppercase tracking-widest ml-1">Shipping Address</label>
                <textarea
                  [(ngModel)]="address"
                  name="address"
                  rows="3"
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 text-gray-900 font-bold focus:ring-2 focus:ring-orange-600/20 transition-all resize-none outline-none"
                  placeholder="Your residential address..."
                ></textarea>
              </div>
            </div>

            <!-- Password Section -->
            <div class="pt-8 border-t border-gray-100">
              <div class="flex items-center gap-3 mb-6">
                <div class="w-8 h-8 bg-gray-100 text-gray-600 rounded-lg flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </div>
                <h3 class="text-xl font-black text-gray-900 uppercase tracking-tighter">Security</h3>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="space-y-2">
                  <label class="text-sm font-black text-gray-400 uppercase tracking-widest ml-1">New Password</label>
                  <input
                    type="password"
                    [(ngModel)]="password"
                    name="password"
                    class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 text-gray-900 font-bold focus:ring-2 focus:ring-orange-600/20 transition-all outline-none"
                    placeholder="••••••••"
                  />
                </div>
                <div class="space-y-2">
                  <label class="text-sm font-black text-gray-400 uppercase tracking-widest ml-1">Confirm Password</label>
                  <input
                    type="password"
                    [(ngModel)]="confirmPassword"
                    name="confirmPassword"
                    class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 text-gray-900 font-bold focus:ring-2 focus:ring-orange-600/20 transition-all outline-none"
                    placeholder="••••••••"
                  />
                </div>
              </div>
            </div>

            <div class="pt-4">
              <button
                type="submit"
                [disabled]="loading()"
                class="w-full sm:w-auto bg-orange-600 hover:bg-orange-700 text-white font-black px-10 py-5 rounded-[1.5rem] shadow-2xl shadow-orange-600/20 transition-all active:scale-95 flex items-center justify-center gap-3 disabled:opacity-70 cursor-pointer"
              >
                @if (loading()) {
                  <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                } @else {
                  <span>Save Changes</span>
                }
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
