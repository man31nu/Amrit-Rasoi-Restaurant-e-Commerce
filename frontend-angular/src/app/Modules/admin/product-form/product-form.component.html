<div class="min-h-screen bg-[#f8fafc] pt-28 pb-20">
  <div class="max-w-4xl mx-auto px-6">
    <div class="flex items-center justify-between mb-8">
      <a 
        routerLink="/admin"
        class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors font-bold group cursor-pointer"
      >
        <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Dashboard
      </a>
      <div class="text-right">
        <h1 class="text-3xl font-black text-gray-900 tracking-tight">
          {{ isEdit() ? 'Refine' : 'Add New' }} <span class="text-orange-600">Creation</span>
        </h1>
        <p class="text-gray-500 text-sm font-medium mt-1">
          Crafting premium culinary experiences.
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2">
        <form 
          (ngSubmit)="handleSubmit()"
          class="bg-white rounded-[2.5rem] shadow-xl shadow-orange-900/5 p-8 md:p-10 border border-gray-100 space-y-8"
        >
          <div class="space-y-6">
            <div class="space-y-2">
              <label class="block text-sm font-black text-gray-900 uppercase tracking-widest pl-1">
                Dish Name
              </label>
              <input
                type="text"
                required
                placeholder="e.g. Truffle Infused Paneer"
                class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 focus:ring-4 focus:ring-orange-500/10 transition-all font-bold text-gray-800 outline-none"
                [(ngModel)]="name"
                name="name"
              />
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="space-y-2">
                <label class="block text-sm font-black text-gray-900 uppercase tracking-widest pl-1">
                  Category
                </label>
                <select
                  required
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 focus:ring-4 focus:ring-orange-500/10 transition-all font-bold text-gray-800 appearance-none cursor-pointer outline-none"
                  [(ngModel)]="category"
                  name="category"
                >
                  <option value="">Select Genre</option>
                  <option value="Veg Main Course">Veg Main Course</option>
                  <option value="Non-Veg Main Course">Non-Veg Main Course</option>
                  <option value="Pizza">Artisan Pizza</option>
                  <option value="Burgers">Gourmet Burgers</option>
                  <option value="Desserts">Sweet Delights</option>
                  <option value="Drinks">Premium Spirits</option>
                </select>
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-black text-gray-900 uppercase tracking-widest pl-1">
                  Price (₹)
                </label>
                <input
                  type="number"
                  required
                  placeholder="Amount in ₹"
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 focus:ring-4 focus:ring-orange-500/10 transition-all font-bold text-gray-800 outline-none"
                  [(ngModel)]="price"
                  name="price"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="space-y-2">
                <label class="block text-sm font-black text-gray-900 uppercase tracking-widest pl-1">
                  Dietary Type
                </label>
                <div class="flex items-center gap-4 bg-gray-50 p-2.5 rounded-2xl">
                  <label class="flex items-center gap-2 font-bold text-sm cursor-pointer text-gray-700">
                    <input
                      type="radio"
                      [value]="true"
                      [(ngModel)]="isVeg"
                      name="isVeg"
                      class="text-emerald-600 focus:ring-emerald-500"
                    />
                    <span class="w-4 h-4 border-2 border-emerald-600 rounded-sm bg-white flex items-center justify-center">
                      <span class="w-2 h-2 bg-emerald-600 rounded-[1px]"></span>
                    </span>
                    Veg
                  </label>
                  <label class="flex items-center gap-2 font-bold text-sm cursor-pointer text-gray-700">
                    <input
                      type="radio"
                      [value]="false"
                      [(ngModel)]="isVeg"
                      name="isVeg"
                      class="text-rose-600 focus:ring-rose-500"
                    />
                    <span class="w-4 h-4 border-2 border-rose-600 rounded-sm bg-white flex items-center justify-center">
                      <span class="w-2 h-2 bg-rose-600 rounded-[1px]"></span>
                    </span>
                    Non-Veg
                  </label>
                </div>
              </div>

              <div class="space-y-2">
                <label class="block text-sm font-black text-gray-900 uppercase tracking-widest pl-1">
                  Spice Level
                </label>
                <select
                  required
                  class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 focus:ring-4 focus:ring-orange-500/10 transition-all font-bold text-gray-800 appearance-none cursor-pointer outline-none"
                  [(ngModel)]="spiceLevel"
                  name="spiceLevel"
                >
                  <option value="Mild">Mild</option>
                  <option value="Medium">Medium</option>
                  <option value="Spicy">Spicy</option>
                </select>
              </div>
            </div>

            <div class="space-y-2">
              <label class="block text-sm font-black text-gray-900 uppercase tracking-widest pl-1">
                Description
              </label>
              <textarea
                required
                rows="4"
                placeholder="Describe the craft, the ingredients, and the passion..."
                class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 focus:ring-4 focus:ring-orange-500/10 transition-all font-bold text-gray-800 resize-none outline-none"
                [(ngModel)]="description"
                name="description"
              ></textarea>
            </div>
          </div>

          <div class="pt-4">
            <button
              type="submit"
              [disabled]="loading()"
              class="w-full bg-orange-600 text-white py-5 rounded-[2rem] font-black text-lg hover:shadow-2xl hover:shadow-orange-600/20 active:scale-95 transition-all flex items-center justify-center gap-3 disabled:opacity-70 cursor-pointer"
            >
              @if (loading()) {
                <div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
              } @else {
                <span>{{ isEdit() ? 'Update Creation' : 'Publish Dish' }}</span>
              }
            </button>
          </div>
        </form>
      </div>

      <div class="lg:col-span-1">
        <div class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-orange-900/5 border border-gray-100">
          <label class="block text-sm font-black text-gray-900 uppercase tracking-widest mb-6">
            Culinary Visual
          </label>
          
          <div class="relative group overflow-hidden rounded-[2rem] border-2 border-dashed border-gray-200 hover:border-orange-500 transition-colors">
            <input
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              class="absolute inset-0 z-10 cursor-pointer opacity-0"
            />
            
            @if (preview()) {
              <div class="relative aspect-square">
                <img 
                  [src]="preview()" 
                  alt="Preview" 
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                />
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                  <div class="bg-white p-3 rounded-full text-gray-900 font-bold text-xs flex items-center gap-2">
                    Change Image
                  </div>
                </div>
              </div>
            } @else {
              <div class="aspect-square flex flex-col items-center justify-center text-center p-8">
                <div class="w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-4">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                </div>
                <p class="text-gray-900 font-bold">Select Dish Image</p>
                <p class="text-gray-400 text-xs mt-1">High-quality JPG, PNG up to 10MB</p>
              </div>
            }
          </div>

          <div class="mt-8 space-y-4">
            <div class="p-4 bg-orange-50/50 rounded-2xl border border-orange-100/50">
              <p class="text-sm font-medium text-orange-900/70 italic text-center">
                "Visuals determine 80% of culinary desire. Shoot for beauty."
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
