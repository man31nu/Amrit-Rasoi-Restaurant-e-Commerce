<div class="min-h-screen bg-white font-sans text-gray-900 selection:bg-orange-100 selection:text-orange-900 flex flex-col justify-between">
  <!-- Global Toaster -->
  <app-toast></app-toast>

  <!-- Navbar -->
  <app-navbar></app-navbar>

  <!-- Main Router Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Floating Mobile Cart Button -->
  @if (showFloatingCart()) {
    <div class="md:hidden fixed bottom-6 right-6 z-40 animate-fadeIn">
      <a
        routerLink="/cart"
        class="bg-orange-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center relative group overflow-hidden cursor-pointer"
      >
        <span class="text-2xl">🛍️</span>
        <span class="absolute -top-1 -right-1 bg-white text-orange-600 text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow-lg border-2 border-orange-600">
          {{ cartService.totalCount() }}
        </span>
      </a>
    </div>
  }

  <!-- Footer -->
  <app-footer></app-footer>
</div>
